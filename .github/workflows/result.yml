name: Collision Analysis

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate collision report
        run: npm run analyze:collisions -- ./corpus --json collision-report.json

      - name: Upload collision report
        uses: actions/upload-artifact@v4
        with:
          name: collision-report
          path: collision-report.json
          if-no-files-found: error
          retention-days: 30
